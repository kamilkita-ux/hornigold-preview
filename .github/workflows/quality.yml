name: Hornigold quality
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.alert_test && '[TEST ALARMU] Hornigold quality' || 'Hornigold quality' }}
on:
  pull_request:
  workflow_dispatch:
    inputs:
      alert_test:
        description: Controlled alarm test only; no website outage or transaction
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}-${{ inputs.alert_test && 'alarm-test' || 'normal' }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Controlled alarm self-test
        if: github.event_name == 'workflow_dispatch' && inputs.alert_test == true
        run: |
          echo 'CONTROLLED ALARM TEST: intentional checker failure; no website outage.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-documents.txt
      - name: Audit published PDF structure
        run: python scripts/audit_tagged_legal_candidates.py site/documents --report docs/implementation/evidence/tagged-pdf-structure-current.json
      - run: python scripts/check_repository.py
      - run: python scripts/build.py --mode preview --base /
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/audit_static.py --base /
      - run: python scripts/audit_seo.py --mode preview
      - run: python scripts/audit_discovery.py --mode preview
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: python scripts/build.py --mode production-ready --base /
      - run: python scripts/prepare_cloudflare_production.py
      - run: node --test tests/*.test.mjs
      - name: Mobile and accessibility audit
        run: |
          mkdir -p docs/implementation/evidence
          python -m http.server 4382 --bind 127.0.0.1 --directory _site > /tmp/hornigold-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do curl --fail --silent http://127.0.0.1:4382/pl/ > /dev/null && break; sleep 1; done
          AUDIT_URL=http://127.0.0.1:4382/ node scripts/audit_mobile_release.cjs
      - name: Lighthouse mobile (production-ready artifact)
        run: |
          python -m http.server 4383 --bind 127.0.0.1 --directory _production_ready > /tmp/hornigold-lighthouse.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do curl --fail --silent http://127.0.0.1:4383/pl/ > /dev/null && break; sleep 1; done
          node scripts/audit_lighthouse.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-evidence
          path: docs/implementation/evidence/
          retention-days: 7
