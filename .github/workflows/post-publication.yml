name: Hornigold publication check
on:
  workflow_run:
    workflows: [Publish Hornigold preview]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-check
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify deployed Pages release
        run: python scripts/audit_live_release.py --origin https://kamilkita-ux.github.io --base /hornigold-preview --label github-actions
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-evidence
          path: docs/implementation/evidence/public-github-actions.json
          retention-days: 7
